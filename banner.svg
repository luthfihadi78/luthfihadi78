<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Moch Luthfi Hadiwidjaja — Software Engineer, Web3 and AI">
  <title>Moch Luthfi Hadiwidjaja — Software Engineer · Web3 &amp; AI</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#131E38"/>
      <stop offset="1"   stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#FDE68A"/>
      <stop offset="0.45" stop-color="#FBBF24"/>
      <stop offset="1"   stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B77609" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#B77609" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="280" rx="0"/></clipPath>
  </defs>

  <style>
    /* Base state = final state; animations carry no fill-mode. If the img
       rendering context does not run CSS animation, the banner still draws
       in full — it simply does not move. */
    .nm  { font-family: Verdana, Geneva, "DejaVu Sans", sans-serif; font-size: 52px; font-weight: 700; letter-spacing: -1px; }
    .sub { font-family: "Courier New", Courier, monospace; font-size: 17px; font-weight: 700; letter-spacing: 3.4px; }
    .tag { font-family: "Courier New", Courier, monospace; font-size: 13.5px; letter-spacing: 1.6px; }

    .draw  { animation: draw 2.6s cubic-bezier(.16,1,.3,1) .25s; }
    .riseA { animation: rise 900ms cubic-bezier(.16,1,.3,1) .10s; }
    .riseB { animation: rise 900ms cubic-bezier(.16,1,.3,1) .28s; }
    .riseC { animation: rise 900ms cubic-bezier(.16,1,.3,1) .46s; }
    .bar   { transform: scaleX(1); transform-origin: 96px 96px; animation: grow 800ms cubic-bezier(.16,1,.3,1) .18s; }
    .orb   { animation: float  9s ease-in-out infinite; }
    .orb2  { animation: float2 12s ease-in-out infinite; }
    .blip  { animation: blip 2.6s ease-out infinite; transform-origin: center; }

    @keyframes draw  { from { stroke-dasharray: 1500; stroke-dashoffset: 1500; }
                       to   { stroke-dasharray: 1500; stroke-dashoffset: 0; } }
    @keyframes rise  { from { opacity: 0; transform: translateY(15px); }
                       to   { opacity: 1; transform: translateY(0); } }
    @keyframes grow  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes float { 0%,100% { transform: translate(0,0); } 50% { transform: translate(34px,-18px); } }
    @keyframes float2{ 0%,100% { transform: translate(0,0); } 50% { transform: translate(-28px,16px); } }
    @keyframes blip  { 0% { r: 5; opacity: .8; } 70% { r: 17; opacity: 0; } 100% { r: 5; opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .draw, .riseA, .riseB, .riseC, .bar, .orb, .orb2, .blip { animation: none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="280" fill="url(#bg)"/>

    <!-- ambient -->
    <circle class="orb"  cx="150"  cy="60"  r="230" fill="url(#glowA)"/>
    <circle class="orb2" cx="1080" cy="235" r="200" fill="url(#glowB)"/>

    <!-- grid -->
    <g stroke="#3B4A70" stroke-opacity="0.20" stroke-width="1">
      <path d="M0 70H1200M0 140H1200M0 210H1200"/>
      <path d="M100 0V280M250 0V280M400 0V280M550 0V280M700 0V280M850 0V280M1000 0V280M1150 0V280"/>
    </g>

    <!-- sparkline, drawn on load -->
    <path d="M0 252 L60 244 L110 254 L160 230 L215 239 L268 212 L320 224 L378 194 L430 206 L488 172 L540 186 L598 154 L655 166 L710 134 L768 146 L820 118 L878 130 L935 104 L992 116 L1050 92 L1110 100 L1200 78"
          fill="none" stroke="url(#gold)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"
          opacity="0.38" class="draw"/>
    <path d="M0 252 L60 244 L110 254 L160 230 L215 239 L268 212 L320 224 L378 194 L430 206 L488 172 L540 186 L598 154 L655 166 L710 134 L768 146 L820 118 L878 130 L935 104 L992 116 L1050 92 L1110 100 L1200 78 L1200 314 L0 314 Z"
          fill="url(#fade)" opacity="0.5"/>

    <!-- accent bar -->
    <rect class="bar" x="96" y="93" width="46" height="5" rx="2.5" fill="url(#gold)"/>

    <!-- type -->
    <text class="sub riseA" x="96" y="100" fill="#F59E0B" opacity="0.95">
      <tspan x="158">SOFTWARE ENGINEER · WEB3 &amp; AI</tspan>
    </text>
    <text class="nm riseB" x="96" y="163" fill="#F8FAFC">Moch Luthfi <tspan fill="url(#gold)">Hadiwidjaja</tspan></text>
    <text class="tag riseC" x="96" y="205" fill="#A9B6CC">
      Kotlin · Flutter · Spring Boot · Python · Solidity
    </text>

    <!-- live dot -->
    <g transform="translate(1108,42)">
      <circle class="blip" r="5" fill="#34D399" opacity="0.55"/>
      <circle r="5" fill="#34D399"/>
      <text class="tag" x="18" y="5" fill="#8A97B2">live</text>
    </g>
  </g>
</svg>
